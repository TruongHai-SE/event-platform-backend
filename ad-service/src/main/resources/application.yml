server:
  port: 8086
spring:
  application:
    name: ad-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${AD_DB_NAME:event_ad_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
security:
  token:
    secret-key: ${TOKEN_SECRET_KEY}
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  upload-preset: ${CLOUDINARY_UPLOAD_PRESET:}
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
