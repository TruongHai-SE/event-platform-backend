server:
  port: 8084

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${ORDER_DB_NAME:event_order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  lock:
    wait-time-seconds: ${LOCK_WAIT_TIME_SECONDS:5}
    lease-time-seconds: ${LOCK_LEASE_TIME_SECONDS:-1}

order:
  hold-minutes: ${ORDER_HOLD_MINUTES:15}
  expiration-check-interval-ms: ${ORDER_EXPIRATION_CHECK_INTERVAL_MS:30000}
  expiration-initial-delay-ms: ${ORDER_EXPIRATION_INITIAL_DELAY_MS:10000}
  scheduler:
    enabled: ${ORDER_SCHEDULER_ENABLED:true}
    lock-key: ${ORDER_SCHEDULER_LOCK_KEY:lock:scheduler:order-expiration}
    lock-lease-time-seconds: ${ORDER_SCHEDULER_LOCK_LEASE_TIME_SECONDS:25}
    batch-size: ${ORDER_SCHEDULER_BATCH_SIZE:100}

security:
  token:
    secret-key: ${TOKEN_SECRET_KEY}
  internal:
    secret: ${INTERNAL_API_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
