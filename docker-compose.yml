services:
  postgres:
    image: postgres:16-alpine
    container_name: event-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: "event_auth_db,event_user_db,event_events_db,event_promotion_db,event_ad_db,event_ticket_db,event_order_db"
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    networks:
      - event-network

  redis:
    image: redis:7-alpine
    container_name: event-platform-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - event-network

volumes:
  postgres_data:

networks:
  event-network:
    driver: bridge
