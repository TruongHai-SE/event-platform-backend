server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${AUTH_DB_NAME:event_auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

security:
  brevo:
    api-key: ${BREVO_API_KEY}
  token:
    secret-key: ${TOKEN_SECRET_KEY}
    access-expiration-ms: ${TOKEN_ACCESS_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-days: ${TOKEN_REFRESH_EXPIRATION_DAYS:7} # 7 days
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
  mail:
    from-email: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:Event and Festival Platform}
  internal:
    secret: ${INTERNAL_API_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
