server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**, /api/v1/roles/**, /api/v1/permissions/**

        - id: promotion-service-route
          uri: lb://promotion-service
          predicates:
            - Path=/api/v1/admin/vouchers/**, /api/v1/organizer/vouchers/**, /api/v1/vouchers/**, /internal/v1/vouchers/**

        - id: ad-service-route
          uri: lb://ad-service
          predicates:
            - Path=/api/v1/public/banners/**, /api/v1/public/ad-position-prices/**, /api/v1/admin/ad-packages/**, /api/v1/admin/ad-position-prices/**, /api/v1/admin/ad-campaigns/**, /api/v1/admin/banners/**, /api/v1/organizer/ad-campaigns/**, /internal/v1/ad-campaigns/**

        - id: auth-service-docs
          uri: lb://auth-service
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - SetPath=/v3/api-docs

        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - SetPath=/v3/api-docs

        - id: promotion-service-docs
          uri: lb://promotion-service
          predicates:
            - Path=/v3/api-docs/promotion-service
          filters:
            - SetPath=/v3/api-docs

        - id: ad-service-docs
          uri: lb://ad-service
          predicates:
            - Path=/v3/api-docs/ad-service
          filters:
            - SetPath=/v3/api-docs

        - id: ticket-service-route
          uri: lb://ticket-service
          predicates:
            - Path=/api/v1/tickets/**, /api/v1/check-ins/**

        - id: ticket-service-docs
          uri: lb://ticket-service
          predicates:
            - Path=/v3/api-docs/ticket-service
          filters:
            - SetPath=/v3/api-docs

        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**

        - id: order-service-docs
          uri: lb://order-service
          predicates:
            - Path=/v3/api-docs/order-service
          filters:
            - SetPath=/v3/api-docs

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 1. Auth Service (Định danh & Xác thực)
        url: /v3/api-docs/auth-service
      - name: 2. User Service (Hồ sơ & Phân quyền)
        url: /v3/api-docs/user-service
      - name: 3. Promotion Service (Voucher)
        url: /v3/api-docs/promotion-service
      - name: 4. Ad Service (Quảng cáo)
        url: /v3/api-docs/ad-service
      - name: 5. Ticket Service (Vé & Check-in)
        url: /v3/api-docs/ticket-service
      - name: 6. Order Service (Đơn hàng & Giữ chỗ)
        url: /v3/api-docs/order-service
