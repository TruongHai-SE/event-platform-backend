server:
  port: ${PAYMENT_SERVICE_PORT:8088}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${PAYMENT_DB_NAME:event_payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

payment:
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:DEMOVNPAY}
    hash-secret: ${VNPAY_HASH_SECRET:DEMOHASHSECRETKEY}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-callback}
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  sepay:
    api-key: ${SEPAY_API_KEY:sepay_secret_tkz_2026}
    account-number: ${SEPAY_BANK_ACCOUNT:0000000001}
    bank-name: ${SEPAY_BANK_NAME:MBBank}
    qr-template: ${SEPAY_QR_TEMPLATE:compact}
    qr-base-url: ${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}


security:
  token:
    secret-key: ${TOKEN_SECRET_KEY}
  internal:
    secret: ${INTERNAL_API_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
