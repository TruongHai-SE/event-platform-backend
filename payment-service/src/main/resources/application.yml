server:
  port: ${PAYMENT_SERVICE_PORT:8088}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${PAYMENT_DB_NAME:event_payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  messaging:
    enabled: ${APP_MESSAGING_ENABLED:true}

payment:
  mock-refund: ${PAYMENT_MOCK_REFUND:true}
  refund:
    batch:
      default-chunk-size: ${PAYMENT_REFUND_BATCH_CHUNK_SIZE:50}
      default-requests-per-second: ${PAYMENT_REFUND_BATCH_RPS:10.0}
      delay-between-chunks-ms: ${PAYMENT_REFUND_BATCH_CHUNK_DELAY_MS:50}
      max-retries: ${PAYMENT_REFUND_BATCH_MAX_RETRIES:3}
      initial-backoff-ms: ${PAYMENT_REFUND_BATCH_INITIAL_BACKOFF_MS:100}
      backoff-multiplier: ${PAYMENT_REFUND_BATCH_BACKOFF_MULTIPLIER:2.0}
      item-timeout-ms: ${PAYMENT_REFUND_BATCH_ITEM_TIMEOUT_MS:5000}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:DEMOVNPAY}
    hash-secret: ${VNPAY_HASH_SECRET:DEMOHASHSECRETKEY}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-callback}
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  sepay:
    api-key: ${SEPAY_API_KEY:sepay_secret_tkz_2026}
    account-number: ${SEPAY_BANK_ACCOUNT:0000000001}
    bank-name: ${SEPAY_BANK_NAME:MBBank}
    qr-template: ${SEPAY_QR_TEMPLATE:compact}
    qr-base-url: ${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}
  scheduler:
    enabled: ${PAYMENT_SCHEDULER_ENABLED:true}
    expiration-check-interval-ms: ${PAYMENT_EXPIRATION_CHECK_INTERVAL_MS:30000}
    expiration-initial-delay-ms: ${PAYMENT_EXPIRATION_INITIAL_DELAY_MS:10000}
    expiration-threshold-minutes: ${PAYMENT_EXPIRATION_THRESHOLD_MINUTES:15}


security:
  token:
    secret-key: ${TOKEN_SECRET_KEY}
  internal:
    secret: ${INTERNAL_API_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
